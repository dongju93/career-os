[project]
name = "career-os"
version = "0.1.0"
description = "CareerOS backend API service"
readme = "README.md"
requires-python = ">=3.15"
authors = [{ name = "dongju93" }]
maintainers = [{ name = "dongju93" }]
dependencies = [
    "authlib==1.9.5",
    "beautifulsoup4==4.15.0",
    "fastapi[standard]==0.162.0",
    "httpx2==2.16.0",
    "itsdangerous==2.2.0",
    "openai-chatkit==1.6.5",
    "psycopg-pool==3.3.3",
    "psycopg[binary]==3.3.8",
    "pydantic-settings==2.16.2",
    "python-jose[cryptography]==3.5.0",
    "redis[hiredis]==8.1.0",
    "sentry-sdk==2.74.0",
]

[dependency-groups]
dev = [
    "fakeredis[lua]==2.40.0",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-cov==7.1.0",
    "types-authlib==1.8.0.20261106",
    "types-python-jose==3.5.0.20260408",
]

[project.urls]
Repository = "https://github.com/dongju93/career-os"
Issues = "https://linear.app/careeros999/team/CAR"
Documentation = "https://eoth999-1775281441291.atlassian.net/wiki/spaces/CareerOS"
"Software Engineer" = "https://github.com/dongju93"
"Product Manager" = "https://github.com/SoEun99"
"Database Management" = "https://console.neon.tech/app/projects/twilight-firefly-07947306"
"Backend Deployment" = "https://dashboard.fastapicloud.com/spdlqj011-77893206/apps/career-os/deployments"

[tool.ruff]
target-version = "py315"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "N",  # pep8-naming
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["career_os_api"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.fastapi]
entrypoint = "main:career_os"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # Suppress spurious import-time warnings from openai-chatkit 1.6.5 subclassing its own deprecated BoxBase.
    'ignore:^Direct usage of named widget classes is deprecated[.]:DeprecationWarning:^abc$',
]

[tool.pyrefly]
project-includes = ["**/*.py*", "**/*.ipynb"]
